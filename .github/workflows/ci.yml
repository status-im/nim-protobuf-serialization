name: CI
on:
  push:
    branches:
      - master
      - test-minver
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@minver
    with:
      install-command: 'nimble --resolver:minver install -y --depsOnly'
      test-command: |
        if [[ "${{ matrix.target.os }}" == "windows" ]]; then
          # https://github.com/status-im/nimbus-eth2/issues/3121
          export NIMFLAGS="-d:nimRawSetjmp"
        fi
        nimble dump --solve
        nimble list --installed --version
        nimble setup
        env NIMLANG="c" nimble test
        env NIMLANG="cpp" nimble test
        nimble examples
